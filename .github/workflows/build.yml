name: Build Jarvis APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (pin 8.7)
        working-directory: android-app
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build debug APK
        working-directory: android-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk jarvis.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-app
          name: J.A.R.V.I.S. Android-App
          body: Installierbare Android-App. Laden, antippen, installieren. Groq-Key beim ersten Start in den Einstellungen eintragen.
          files: jarvis.apk
